[project]
name = "machine-learning"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Debasis Das", email = "dasrici2001@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "ggplot>=0.11.5",
    "jax>=0.11.1",
    "keras>=3.15.1",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.1",
    "networkx>=3.6.1",
    "numpy>=2.5.2",
    "optuna>=4.9.0",
    "pandas>=3.0.5",
    "pingouin>=0.6.1",
    "plotly>=7.0.0",
    "polar>=0.0.127",
    "polars>=1.44.1",
    "pymc>=6.3.1",
    "requests>=2.34.2",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
    "statsmodels>=0.15.0",
    "sympy>=1.14.0",
    "xgboost>=3.4.1",
]

[project.scripts]
machine-learning = "machine_learning:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.uv.workspace]
members = [
    "Machine-Learning-PhD",
]
